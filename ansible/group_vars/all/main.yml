eks_tunnel_local_port: 8443
kubeconfig_path: "{{ playbook_dir | dirname | dirname }}/.generated/kubeconfig"

backend_image: "{{ backend_repository_url }}:{{ initial_image_tag }}"
frontend_image: "{{ frontend_repository_url }}:{{ initial_image_tag }}"

backend_deployment: hospital-backend
backend_container: backend
# The backend's Prometheus endpoint (KestrelMetricServer in the app's
# Program.cs). policy/network.yaml.j2 opens it to the control plane only.
backend_metrics_port: 9091
frontend_deployment: hospital-frontend
frontend_container: frontend

ingress_name: hospital-ingress
alb_name: hospital-system-alb

load_balancer_controller_chart_version: "3.5.0"
metrics_server_chart_version: "3.14.0"
external_secrets_chart_version: "2.11.0"

# psql and pg_dump for seed.sql: playbooks/database.yml loads it into a new
# database, and playbooks/dump-database.yml saves the database into it. The
# Docker Official Image through ECR Public, which has no Docker Hub pull limits.
db_client_image: public.ecr.aws/docker/library/postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
# kubectl run --overrides for that pod; each playbook names it in
# db_client_pod. The namespace enforces the restricted Pod Security Standard.
# UID 70 is the Alpine image's postgres user.
db_client_overrides:
  spec:
    automountServiceAccountToken: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 70
      runAsGroup: 70
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: "{{ db_client_pod }}"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi

cloudflare_record_name: "{{ app_domain_name }}"
cloudflare_record_type: CNAME
cloudflare_record_proxied: false
cloudflare_record_ttl: 1
cloudflare_alb_wait_retries: 30
cloudflare_alb_wait_delay: 20

demo_login_enabled: true

kubernetes_manifests:
  - namespace.yaml.j2
  - backend/configmap.yaml.j2
  - backend/service.yaml.j2
  - backend/hpa.yaml.j2
  - backend/pdb.yaml.j2
  - frontend/service.yaml.j2
  - frontend/hpa.yaml.j2
  - frontend/pdb.yaml.j2
  - rbac/github-actions-deploy.yaml.j2
  - policy/trusted-workloads.yaml.j2
  - policy/deploy-image-only.yaml.j2
  - policy/network.yaml.j2
  - ingress/ingress.yaml.j2

kubernetes_workload_manifests:
  - backend/deployment.yaml.j2
  - frontend/deployment.yaml.j2
