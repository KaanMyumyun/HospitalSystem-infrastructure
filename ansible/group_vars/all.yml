aws_region: eu-north-1
eks_cluster_name: eks-pr1
k8s_namespace: hospitalsystem

ecr_registry: "{{ lookup('ansible.builtin.env', 'ECR_REGISTRY') }}"
backend_image_name: hospital-backend
frontend_image_name: hospital-frontend
backend_image: "{{ ecr_registry }}/{{ backend_image_name }}:latest"
frontend_image: "{{ ecr_registry }}/{{ frontend_image_name }}:latest"

backend_deployment: hospital-backend
backend_container: backend
frontend_deployment: hospital-frontend
frontend_container: frontend

github_actions_deploy_role_arn: "{{ lookup('ansible.builtin.env', 'GITHUB_ACTIONS_DEPLOY_ROLE_ARN') }}"
github_actions_deploy_group: hospitalsystem:deployers
github_actions_deploy_username: github-actions-eks-deploy
eks_node_role_arn: "{{ lookup('ansible.builtin.env', 'EKS_NODE_ROLE_ARN') }}"
load_balancer_controller_role_arn: "{{ lookup('ansible.builtin.env', 'LOAD_BALANCER_CONTROLLER_ROLE_ARN') }}"
acm_certificate_arn: "{{ lookup('ansible.builtin.env', 'ACM_CERTIFICATE_ARN') }}"

ingress_name: hospital-ingress
app_domain_name: app.hospitalsyst.cc

cloudflare_zone_name: hospitalsyst.cc
cloudflare_record_name: app.hospitalsyst.cc
cloudflare_record_type: CNAME
cloudflare_record_proxied: false
cloudflare_record_ttl: 1
cloudflare_alb_wait_retries: 30
cloudflare_alb_wait_delay: 20

monitoring_alarm_prefix: hospitalsystem
monitoring_alb_name: hospital-system-alb
monitoring_nodegroup_name: hospitalsystempr1
monitoring_alert_sns_topic_arn: ""
terraform_vpc_name_tag: kubes-Terraform

kubernetes_manifest_files:
  - kubernetes/namespace.yaml
  - kubernetes/backend/configmap.yaml
  - kubernetes/backend/service.yaml
  - kubernetes/backend/hpa.yaml
  - kubernetes/frontend/service.yaml
  - kubernetes/frontend/hpa.yaml
  - kubernetes/rbac/github-actions-deploy.yaml

kubernetes_manifest_templates:
  - src: kubernetes/backend/deployment.yaml.j2
    dest: backend-deployment.yaml
  - src: kubernetes/frontend/deployment.yaml.j2
    dest: frontend-deployment.yaml
  - src: kubernetes/ingress/ingress.yaml.j2
    dest: ingress.yaml
