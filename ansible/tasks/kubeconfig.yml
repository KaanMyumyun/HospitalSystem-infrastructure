---
# Shared by every playbook that talks to the cluster. Runs update-kubeconfig
# once per ansible-playbook run, even when bootstrap imports many playbooks.
# Set kubeconfig_optional: true to continue when the cluster is unreachable.

- name: Require Terraform-generated variables
  ansible.builtin.assert:
    that:
      - eks_cluster_name is defined
      - aws_region is defined
    fail_msg: >-
      ansible/group_vars/all/terraform.yml is missing. Run ./scripts/tf.sh apply
      to generate it.
    quiet: true

- name: Configure kubeconfig
  ansible.builtin.command:
    argv:
      - aws
      - eks
      - update-kubeconfig
      - --region
      - "{{ aws_region }}"
      - --name
      - "{{ eks_cluster_name }}"
  register: kubeconfig_update
  changed_when: false
  failed_when: kubeconfig_update.rc != 0 and not (kubeconfig_optional | default(false))
  when: not (kubeconfig_configured | default(false))

- name: Remember kubeconfig is configured for this run
  ansible.builtin.set_fact:
    kubeconfig_configured: true
  when: kubeconfig_update.rc | default(1) == 0
