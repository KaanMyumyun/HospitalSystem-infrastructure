---

- name: Configure kubeconfig through the SSM tunnel
  when: not (kubeconfig_configured | default(false))
  block:
    - name: Require Terraform-generated variables
      ansible.builtin.assert:
        that:
          - eks_cluster_name is defined
          - aws_region is defined
          - ops_instance_id is defined
        fail_msg: >-
          ansible/group_vars/all/terraform.yml is missing or out of date. Run
          ./scripts/tf.sh apply to generate it.
        quiet: true

    - name: Check for the Session Manager plugin
      ansible.builtin.command:
        argv: [bash, -c, "command -v session-manager-plugin"]
      register: ssm_plugin
      changed_when: false
      failed_when: false

    - name: Require the Session Manager plugin
      ansible.builtin.assert:
        that: ssm_plugin.rc == 0
        fail_msg: >-
          session-manager-plugin is not installed, so the private EKS API can't
          be reached. Install it:
          https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager-working-with-install-plugin.html
        quiet: true

    - name: Configure kubeconfig
      ansible.builtin.command:
        argv:
          - aws
          - eks
          - update-kubeconfig
          - --region
          - "{{ aws_region }}"
          - --name
          - "{{ eks_cluster_name }}"
      register: kubeconfig_update
      changed_when: false

    - name: Look up the cluster ARN and private endpoint
      ansible.builtin.command:
        argv:
          - aws
          - eks
          - describe-cluster
          - --region
          - "{{ aws_region }}"
          - --name
          - "{{ eks_cluster_name }}"
          - --query
          - "cluster.[arn, endpoint]"
          - --output
          - text
      register: eks_cluster_info
      changed_when: false

    - name: Remember the cluster ARN and endpoint host
      ansible.builtin.set_fact:
        eks_cluster_arn: "{{ eks_cluster_info.stdout.split()[0] }}"
        eks_endpoint_host: "{{ eks_cluster_info.stdout.split()[1] | urlsplit('hostname') }}"

    - name: Check whether the tunnel is already open
      ansible.builtin.command:
        argv: [bash, -c, 'exec 3<>"/dev/tcp/127.0.0.1/$1"', _, "{{ eks_tunnel_local_port }}"]
      register: eks_tunnel_probe
      changed_when: false
      failed_when: false

    - name: Wait for the ops instance to register with SSM
      ansible.builtin.command:
        argv:
          - aws
          - ssm
          - describe-instance-information
          - --region
          - "{{ aws_region }}"
          - --filters
          - "Key=InstanceIds,Values={{ ops_instance_id }}"
          - --query
          - "InstanceInformationList[0].PingStatus"
          - --output
          - text
      register: ops_ssm_status
      changed_when: false
      until: ops_ssm_status.stdout == "Online"
      retries: 30
      delay: 10
      when: eks_tunnel_probe.rc != 0

    - name: Open the SSM tunnel to the private EKS endpoint
      ansible.builtin.command:
        argv:
          - aws
          - ssm
          - start-session
          - --region
          - "{{ aws_region }}"
          - --target
          - "{{ ops_instance_id }}"
          - --document-name
          - AWS-StartPortForwardingSessionToRemoteHost
          - --parameters
          - "{{ {'host': [eks_endpoint_host], 'portNumber': ['443'], 'localPortNumber': [eks_tunnel_local_port | string]} | to_json }}"
      async: 43200
      poll: 0
      changed_when: true
      when: eks_tunnel_probe.rc != 0

    - name: Wait for the tunnel to accept connections
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ eks_tunnel_local_port }}"
        timeout: 60

    - name: Point kubeconfig at the tunnel
      ansible.builtin.command:
        argv:
          - kubectl
          - config
          - set-cluster
          - "{{ eks_cluster_arn }}"
          - "--server=https://127.0.0.1:{{ eks_tunnel_local_port }}"
          - "--tls-server-name={{ eks_endpoint_host }}"
      changed_when: false

    - name: Check the Kubernetes API answers through the tunnel
      ansible.builtin.command:
        argv: [kubectl, get, --raw, /readyz, --request-timeout=20s]
      changed_when: false

    - name: Remember kubeconfig is configured for this run
      ansible.builtin.set_fact:
        kubeconfig_configured: true

  rescue:
    - name: Stop unless the cluster is optional for this playbook
      ansible.builtin.fail:
        msg: >-
          Could not reach the EKS API through the SSM tunnel:
          {{ ansible_failed_result.msg | default('') }}
          {{ ansible_failed_result.stderr | default('') }}
          If a tunnel from before a cluster rebuild is still open, close it with
          pkill -f AWS-StartPortForwardingSessionToRemoteHost and run again.
      when: not (kubeconfig_optional | default(false))
