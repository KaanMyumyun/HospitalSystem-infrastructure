---
- name: Configure EKS aws-auth for GitHub Actions deploy role
  hosts: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

  vars:
    aws_auth_map_roles: |
      - rolearn: {{ eks_node_role_arn }}
        groups:
        - system:bootstrappers
        - system:nodes
        username: system:node:{{ '{{' }}EC2PrivateDNSName{{ '}}' }}
      - rolearn: {{ github_actions_deploy_role_arn }}
        groups:
        - {{ github_actions_deploy_group }}
        username: {{ github_actions_deploy_username }}

  tasks:
    - name: Configure kubeconfig
      ansible.builtin.import_tasks: ../tasks/kubeconfig.yml

    - name: Read aws-auth ConfigMap
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - configmap
          - aws-auth
          - -n
          - kube-system
          - -o
          - yaml
      register: aws_auth_current
      changed_when: false
      failed_when: false

    - name: Create aws-auth ConfigMap when missing
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl create configmap aws-auth -n kube-system \
          --from-file=mapRoles=/dev/stdin --dry-run=client -o yaml <<'MAPROLES' | kubectl apply -f -
        {{ aws_auth_map_roles }}
        MAPROLES
      args:
        executable: /bin/bash
      register: aws_auth_create
      changed_when: "'created' in aws_auth_create.stdout or 'configured' in aws_auth_create.stdout"
      when: aws_auth_current.rc != 0

    - name: Map GitHub Actions deploy role in aws-auth
      ansible.builtin.command:
        argv:
          - kubectl
          - patch
          - configmap
          - aws-auth
          - -n
          - kube-system
          - --type
          - merge
          - -p
          - "{{ {'data': {'mapRoles': aws_auth_map_roles}} | to_json }}"
      register: aws_auth_patch
      changed_when: "'(no change)' not in aws_auth_patch.stdout"
      when:
        - aws_auth_current.rc == 0
        - github_actions_deploy_role_arn not in aws_auth_current.stdout
