---
- name: Configure local kubeconfig for EKS
  hosts: local
  gather_facts: false

  tasks:
    - name: Update kubeconfig
      ansible.builtin.command:
        argv:
          - aws
          - eks
          - update-kubeconfig
          - --region
          - "{{ aws_region }}"
          - --name
          - "{{ eks_cluster_name }}"
      changed_when: "'Updated context' in kubeconfig_result.stdout"
      register: kubeconfig_result

    - name: Show kubeconfig result
      ansible.builtin.debug:
        var: kubeconfig_result.stdout

