---
- name: Configure local kubeconfig for EKS
  hosts: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

  tasks:
    - name: Update kubeconfig
      ansible.builtin.import_tasks: ../tasks/kubeconfig.yml

    - name: Show kubeconfig result
      ansible.builtin.debug:
        msg:
          - "{{ kubeconfig_update.stdout }}"
          - "Your own kubeconfig is untouched. To use this cluster in your shell: export KUBECONFIG={{ kubeconfig_path }}"

