---
- name: Install AWS Load Balancer Controller
  hosts: local
  gather_facts: false

  tasks:
    - name: Configure kubeconfig
      ansible.builtin.import_tasks: ../tasks/kubeconfig.yml

    - name: Add or update EKS Helm chart repository
      ansible.builtin.shell: |
        set -euo pipefail
        helm repo add eks https://aws.github.io/eks-charts >/dev/null 2>&1 || true
        helm repo update eks
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install or update AWS Load Balancer Controller
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - aws-load-balancer-controller
          - eks/aws-load-balancer-controller
          - --version
          - "{{ load_balancer_controller_chart_version }}"
          - -n
          - kube-system
          - --set
          - "clusterName={{ eks_cluster_name }}"
          - --set
          - "region={{ aws_region }}"
          - --set
          - "vpcId={{ vpc_id }}"
          - --set
          - serviceAccount.name=aws-load-balancer-controller
          - --set
          - "serviceAccount.annotations.eks\\.amazonaws\\.com/role-arn={{ load_balancer_controller_role_arn }}"
      register: lbc_install
      changed_when: "'Release' in lbc_install.stdout"

    - name: Wait for AWS Load Balancer Controller rollout
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - status
          - deployment/aws-load-balancer-controller
          - -n
          - kube-system
          - --timeout=180s
      changed_when: false

