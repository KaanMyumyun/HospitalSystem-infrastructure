---
- name: Configure cost-aware CloudWatch alarms
  hosts: local
  gather_facts: false

  vars:
    # Creation and every cleanup path consume these same alarm definitions.
    alb_alarm_definitions: "{{ lookup('file', playbook_dir ~ '/../../config/alb-alarms.json') | from_json }}"
    # The topic Terraform creates (terraform/monitoring.tf). put-metric-alarm
    # replaces the whole alarm, so each run sets both actions again.
    alarm_action_args:
      - --alarm-actions
      - "{{ monitoring_alert_sns_topic_arn }}"
      - --ok-actions
      - "{{ monitoring_alert_sns_topic_arn }}"

  tasks:
    - name: Require the alert topic from Terraform
      ansible.builtin.assert:
        that: monitoring_alert_sns_topic_arn | default('') | length > 0
        fail_msg: >-
          monitoring_alert_sns_topic_arn is missing from
          ansible/group_vars/all/terraform.yml. Run ./scripts/tf.sh apply to
          generate it.
        quiet: true

    - name: Look up ALB ARN suffix
      ansible.builtin.command:
        argv:
          - aws
          - elbv2
          - describe-load-balancers
          - --region
          - "{{ aws_region }}"
          - --names
          - "{{ alb_name }}"
          - --query
          - LoadBalancers[0].LoadBalancerArn
          - --output
          - text
      register: alb_arn
      changed_when: false

    - name: Look up target groups attached to ALB
      ansible.builtin.command:
        argv:
          - aws
          - elbv2
          - describe-target-groups
          - --region
          - "{{ aws_region }}"
          - --load-balancer-arn
          - "{{ alb_arn.stdout }}"
          - --query
          - TargetGroups[].TargetGroupArn
          - --output
          - text
      register: target_group_arns
      changed_when: false

    - name: Require backend and frontend target groups
      ansible.builtin.fail:
        msg: "Expected at least two target groups attached to {{ alb_name }}."
      when: target_group_arns.stdout.split() | length < 2

    - name: Set ALB CloudWatch dimension value
      ansible.builtin.set_fact:
        alb_dimension: "{{ alb_arn.stdout | regex_replace('^arn:aws:elasticloadbalancing:[^:]+:[0-9]+:loadbalancer/', '') }}"
        target_group_dimensions: >-
          {{ target_group_arns.stdout.split()
             | map('regex_replace', '^arn:aws:elasticloadbalancing:[^:]+:[0-9]+:', '')
             | list }}

    - name: Configure each ALB alarm definition
      ansible.builtin.include_tasks: ../tasks/alb-alarm.yml
      loop: "{{ alb_alarm_definitions }}"
      loop_control:
        loop_var: alarm_definition
        label: "{{ alarm_definition.suffix }}"

    - name: Show configured alarms
      ansible.builtin.command:
        argv:
          - aws
          - cloudwatch
          - describe-alarms
          - --region
          - "{{ aws_region }}"
          - --alarm-name-prefix
          - "{{ monitoring_alarm_prefix }}"
          - --query
          - MetricAlarms[].{Name:AlarmName,State:StateValue,Metric:MetricName}
          - --output
          - table
      register: alarms
      changed_when: false

    - name: Print alarms
      ansible.builtin.debug:
        var: alarms.stdout_lines
