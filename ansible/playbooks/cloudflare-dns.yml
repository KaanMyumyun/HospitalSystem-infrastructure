---
- name: Point Cloudflare DNS to the Kubernetes Ingress ALB
  hosts: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

  vars:
    cloudflare_api_token: "{{ lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') }}"
    cloudflare_zone_id_env: "{{ lookup('ansible.builtin.env', 'CLOUDFLARE_ZONE_ID') }}"
    cloudflare_dns_records_url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/dns_records"

  tasks:
    - name: Require Cloudflare API token
      ansible.builtin.fail:
        msg: >-
          Set CLOUDFLARE_API_TOKEN before running this playbook. The token needs
          Zone:Read and DNS:Edit permissions for {{ cloudflare_zone_name }}.
      when: cloudflare_api_token | length == 0

    - name: Configure kubeconfig
      ansible.builtin.import_tasks: ../tasks/kubeconfig.yml

    - name: Read ALB hostname from Kubernetes Ingress
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - ingress
          - "{{ ingress_name }}"
          - -n
          - "{{ k8s_namespace }}"
          - -o
          - jsonpath={.status.loadBalancer.ingress[0].hostname}
      register: ingress_alb
      changed_when: false
      until: ingress_alb.stdout | length > 0
      retries: "{{ cloudflare_alb_wait_retries }}"
      delay: "{{ cloudflare_alb_wait_delay }}"

    - name: Require Ingress ALB hostname
      ansible.builtin.fail:
        msg: "Ingress {{ ingress_name }} does not have an ALB hostname yet."
      when: ingress_alb.stdout | length == 0

    - name: Look up Cloudflare zone ID
      ansible.builtin.uri:
        url: "https://api.cloudflare.com/client/v4/zones?name={{ cloudflare_zone_name }}"
        method: GET
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
          Content-Type: application/json
        return_content: true
      register: cloudflare_zone_lookup
      when: cloudflare_zone_id_env | length == 0
      no_log: true

    - name: Require the Cloudflare zone
      ansible.builtin.assert:
        that: cloudflare_zone_id_env | length > 0 or cloudflare_zone_lookup.json.result | length == 1
        fail_msg: >-
          Cloudflare has no zone named {{ cloudflare_zone_name }} that the API token
          can read. Check cloudflare_zone_name and give the token Zone:Read on that
          zone, or set CLOUDFLARE_ZONE_ID.
        quiet: true

    - name: Set Cloudflare zone ID
      ansible.builtin.set_fact:
        cloudflare_zone_id: >-
          {{ cloudflare_zone_id_env
             if cloudflare_zone_id_env | length > 0
             else cloudflare_zone_lookup.json.result[0].id }}

    - name: Look up existing Cloudflare DNS records with this name
      ansible.builtin.uri:
        url: "{{ cloudflare_dns_records_url }}?name={{ cloudflare_record_name }}"
        method: GET
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
          Content-Type: application/json
        return_content: true
      register: cloudflare_record_lookup
      no_log: true

    - name: Set existing Cloudflare DNS record
      ansible.builtin.set_fact:
        cloudflare_existing_record_types: "{{ cloudflare_record_lookup.json.result | map(attribute='type') | list }}"
        cloudflare_record_id: "{{ (cloudflare_record_lookup.json.result | first).id | default('') }}"
        cloudflare_existing_record_type: "{{ (cloudflare_record_lookup.json.result | first).type | default('') }}"

    # A CNAME can't share its name with any other record. One A, AAAA or CNAME
    # record is replaced; anything else is left for a person to sort out.
    - name: Require at most one A, AAAA or CNAME record with this name
      ansible.builtin.assert:
        that:
          - cloudflare_existing_record_types | length <= 1
          - cloudflare_existing_record_types | difference(['A', 'AAAA', 'CNAME']) | length == 0
        fail_msg: >-
          {{ cloudflare_record_name }} already has these Cloudflare DNS records:
          {{ cloudflare_existing_record_types | join(', ') }}. The {{ cloudflare_record_type }}
          record can't share its name with them, so delete the ones you don't need
          in Cloudflare and run this playbook again.
        quiet: true

    - name: Delete the existing record of another type
      ansible.builtin.uri:
        url: "{{ cloudflare_dns_records_url }}/{{ cloudflare_record_id }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
          Content-Type: application/json
        status_code: 200
      when:
        - cloudflare_record_id | length > 0
        - cloudflare_existing_record_type != cloudflare_record_type
      no_log: true

    - name: Create Cloudflare DNS record
      ansible.builtin.uri:
        url: "{{ cloudflare_dns_records_url }}"
        method: POST
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          type: "{{ cloudflare_record_type }}"
          name: "{{ cloudflare_record_name }}"
          content: "{{ ingress_alb.stdout }}"
          ttl: "{{ cloudflare_record_ttl }}"
          proxied: "{{ cloudflare_record_proxied }}"
        status_code: 200
      when: cloudflare_record_id | length == 0 or cloudflare_existing_record_type != cloudflare_record_type
      no_log: true

    - name: Update Cloudflare DNS record
      ansible.builtin.uri:
        url: "{{ cloudflare_dns_records_url }}/{{ cloudflare_record_id }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          type: "{{ cloudflare_record_type }}"
          name: "{{ cloudflare_record_name }}"
          content: "{{ ingress_alb.stdout }}"
          ttl: "{{ cloudflare_record_ttl }}"
          proxied: "{{ cloudflare_record_proxied }}"
        status_code: 200
      when:
        - cloudflare_record_id | length > 0
        - cloudflare_existing_record_type == cloudflare_record_type
      no_log: true

    - name: Show DNS target
      ansible.builtin.debug:
        msg: "{{ cloudflare_record_name }} -> {{ ingress_alb.stdout }}"
