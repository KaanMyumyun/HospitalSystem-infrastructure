---
# External Secrets copies the backend secret from AWS Secrets Manager into the
# app namespace (kubernetes/backend/external-secret.yaml.j2). It only watches
# that namespace, with namespace-scoped RBAC and no cluster-wide stores. The
# admission webhook and its certificate controller are left out to save two
# pods on the small nodes; the CRDs' schemas still validate the objects.
- name: Install External Secrets Operator
  hosts: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

  tasks:
    - name: Configure kubeconfig
      ansible.builtin.import_tasks: ../tasks/kubeconfig.yml

    - name: Add External Secrets Helm repository
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - add
          - external-secrets
          - https://charts.external-secrets.io
          - --force-update
      changed_when: false

    - name: Update External Secrets Helm repository
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - update
          - external-secrets
      changed_when: false

    # scopedRBAC puts the chart's Roles and RoleBindings in the app namespace,
    # so it has to exist before the install.
    - name: Ensure namespace exists
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl create namespace "{{ k8s_namespace }}" --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install or upgrade External Secrets
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - external-secrets
          - external-secrets/external-secrets
          - --version
          - "{{ external_secrets_chart_version }}"
          - --namespace
          - external-secrets
          - --create-namespace
          - --set
          - "scopedNamespace={{ k8s_namespace }}"
          - --set
          - scopedRBAC=true
          - --set
          - processClusterStore=false
          - --set
          - processClusterExternalSecret=false
          - --set
          - processClusterPushSecret=false
          - --set
          - processClusterGenerator=false
          - --set
          - webhook.create=false
          - --set
          - certController.create=false
          - --set
          - resources.requests.cpu=10m
          - --set
          - resources.requests.memory=64Mi
          - --set
          - resources.limits.memory=256Mi
      register: external_secrets_install
      changed_when: "'deployed' in external_secrets_install.stdout or 'upgraded' in external_secrets_install.stdout"

    - name: Wait for External Secrets rollout
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - status
          - deployment/external-secrets
          - -n
          - external-secrets
          - --timeout=180s
      changed_when: false
