---
# Undoes pause.yml: scales the node group back to its normal size, waits for
# the nodes, starts the app at each HPA's minimum and turns the alarm
# notifications back on once both Deployments are ready.
- name: Resume HospitalSystem
  hosts: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

  vars:
    app_deployments:
      - "{{ backend_deployment }}"
      - "{{ frontend_deployment }}"

  tasks:
    - name: Configure kubeconfig
      ansible.builtin.import_tasks: ../tasks/kubeconfig.yml

    - name: Read the node group's scaling
      ansible.builtin.command:
        argv:
          - aws
          - eks
          - describe-nodegroup
          - --region
          - "{{ aws_region }}"
          - --cluster-name
          - "{{ eks_cluster_name }}"
          - --nodegroup-name
          - "{{ eks_node_group_name }}"
          - --query
          - nodegroup.scalingConfig
          - --output
          - json
      register: node_scaling
      changed_when: false

    - name: Scale the node group back up
      ansible.builtin.command:
        argv:
          - aws
          - eks
          - update-nodegroup-config
          - --region
          - "{{ aws_region }}"
          - --cluster-name
          - "{{ eks_cluster_name }}"
          - --nodegroup-name
          - "{{ eks_node_group_name }}"
          - --scaling-config
          - "minSize={{ scaling.minSize }},maxSize={{ scaling.maxSize }},desiredSize={{ eks_node_desired_size }}"
          - --query
          - update.id
          - --output
          - text
      vars:
        scaling: "{{ node_scaling.stdout | from_json }}"
      register: node_update
      changed_when: true
      when: scaling.desiredSize != eks_node_desired_size | int

    - name: Wait for the node group update
      ansible.builtin.command:
        argv:
          - aws
          - eks
          - describe-update
          - --region
          - "{{ aws_region }}"
          - --name
          - "{{ eks_cluster_name }}"
          - --nodegroup-name
          - "{{ eks_node_group_name }}"
          - --update-id
          - "{{ node_update.stdout }}"
          - --query
          - update.status
          - --output
          - text
      register: node_update_status
      changed_when: false
      until: node_update_status.stdout in ['Successful', 'Failed', 'Cancelled']
      failed_when: node_update_status.stdout in ['Failed', 'Cancelled']
      retries: 60
      delay: 10
      when: node_update is not skipped

    # Each app spreads one replica per node, so both nodes must be ready.
    - name: Wait for the nodes to be ready
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - nodes
          - -o
          - jsonpath={range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}
      register: node_ready
      changed_when: false
      until: node_ready.stdout_lines | select('equalto', 'True') | list | length >= eks_node_desired_size | int
      retries: 60
      delay: 10

    - name: Read each HPA's minimum
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - hpa
          - "{{ item }}"
          - -n
          - "{{ k8s_namespace }}"
          - -o
          - jsonpath={.spec.minReplicas}
      loop: "{{ app_deployments }}"
      register: hpa_minimums
      changed_when: false

    # The HPA leaves a Deployment at 0 alone, so it has to be started by hand.
    - name: Start the app
      ansible.builtin.command:
        argv:
          - kubectl
          - scale
          - deployment/{{ item.item }}
          - -n
          - "{{ k8s_namespace }}"
          - --current-replicas=0
          - --replicas={{ item.stdout }}
      loop: "{{ hpa_minimums.results }}"
      loop_control:
        label: "{{ item.item }}"
      register: app_scale
      changed_when: app_scale.rc == 0
      # --current-replicas fails when the Deployment isn't at 0, which means
      # it's already running and the HPA manages it.
      failed_when: app_scale.rc != 0 and 'Expected replicas to be 0' not in app_scale.stderr

    - name: Wait for the app
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - status
          - deployment/{{ item }}
          - -n
          - "{{ k8s_namespace }}"
          - --timeout=600s
      loop: "{{ app_deployments }}"
      changed_when: false

    - name: List the monitoring alarms
      ansible.builtin.command:
        argv:
          - aws
          - cloudwatch
          - describe-alarms
          - --region
          - "{{ aws_region }}"
          - --alarm-name-prefix
          - "{{ monitoring_alarm_prefix }}-"
          - --query
          - MetricAlarms[].AlarmName
          - --output
          - json
      register: monitoring_alarms
      changed_when: false

    - name: Turn the alarm notifications back on
      ansible.builtin.command:
        argv: "{{ ['aws', 'cloudwatch', 'enable-alarm-actions', '--region', aws_region, '--alarm-names'] + (monitoring_alarms.stdout | from_json) }}"
      changed_when: true
      when: monitoring_alarms.stdout | from_json | length > 0
