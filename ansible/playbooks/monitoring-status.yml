---
- name: Show monitoring and runtime health
  hosts: local
  gather_facts: false

  tasks:
    - name: Configure kubeconfig
      ansible.builtin.import_tasks: ../tasks/kubeconfig.yml

    - name: Show CloudWatch alarms
      ansible.builtin.command:
        argv:
          - aws
          - cloudwatch
          - describe-alarms
          - --region
          - "{{ aws_region }}"
          - --alarm-name-prefix
          - "{{ monitoring_alarm_prefix }}"
          - --query
          - MetricAlarms[].{Name:AlarmName,State:StateValue,Reason:StateReason}
          - --output
          - table
      register: alarms
      changed_when: false

    - name: Show deployments
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - deployment
          - "{{ backend_deployment }}"
          - "{{ frontend_deployment }}"
          - -n
          - "{{ k8s_namespace }}"
          - -o
          - wide
      register: deployments
      changed_when: false

    - name: Show pods
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - pods
          - -n
          - "{{ k8s_namespace }}"
          - -o
          - wide
      register: pods
      changed_when: false

    - name: Show horizontal pod autoscalers
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - hpa
          - -n
          - "{{ k8s_namespace }}"
          - -o
          - wide
      register: hpas
      changed_when: false

    - name: Show pod resource usage
      ansible.builtin.command:
        argv:
          - kubectl
          - top
          - pods
          - -n
          - "{{ k8s_namespace }}"
      register: pod_resource_usage
      changed_when: false
      failed_when: false

    - name: Show Ingress
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - ingress
          - "{{ ingress_name }}"
          - -n
          - "{{ k8s_namespace }}"
          - -o
          - wide
      register: ingress
      changed_when: false

    - name: Print monitoring status
      ansible.builtin.debug:
        msg:
          - "CloudWatch alarms:"
          - "{{ alarms.stdout_lines }}"
          - "Deployments:"
          - "{{ deployments.stdout_lines }}"
          - "Pods:"
          - "{{ pods.stdout_lines }}"
          - "HorizontalPodAutoscalers:"
          - "{{ hpas.stdout_lines }}"
          - "Pod resource usage:"
          - "{{ pod_resource_usage.stdout_lines if pod_resource_usage.rc == 0 else pod_resource_usage.stderr_lines }}"
          - "Ingress:"
          - "{{ ingress.stdout_lines }}"
