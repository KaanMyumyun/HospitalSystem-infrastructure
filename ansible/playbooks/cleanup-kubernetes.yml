---
- name: Clean up Kubernetes-managed AWS resources before Terraform destroy
  hosts: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

  tasks:
    - name: Configure kubeconfig
      ansible.builtin.import_tasks: ../tasks/kubeconfig.yml
      vars:
        kubeconfig_optional: true

    - name: Delete Ingress so the AWS Load Balancer Controller removes the ALB
      ansible.builtin.command:
        argv:
          - kubectl
          - delete
          - ingress
          - "{{ ingress_name }}"
          - -n
          - "{{ k8s_namespace }}"
          - --ignore-not-found=true
          - --wait=false
          - --request-timeout=20s
      register: delete_ingress
      changed_when: "'deleted' in delete_ingress.stdout"
      failed_when: false
      notify: Wait for the controller to delete the ALB

    # The ALB lookup below must not run until the controller has finished.
    - name: Run the ALB wait now
      ansible.builtin.meta: flush_handlers

    - name: Look up Kubernetes ALB
      ansible.builtin.command:
        argv:
          - aws
          - elbv2
          - describe-load-balancers
          - --region
          - "{{ aws_region }}"
          - --names
          - "{{ alb_name }}"
          - --query
          - LoadBalancers[0].LoadBalancerArn
          - --output
          - text
      register: alb_lookup
      changed_when: false
      failed_when: false

    - name: Delete Kubernetes ALB directly when controller is unavailable
      ansible.builtin.command:
        argv:
          - aws
          - elbv2
          - delete-load-balancer
          - --region
          - "{{ aws_region }}"
          - --load-balancer-arn
          - "{{ alb_lookup.stdout }}"
      when: alb_lookup.rc == 0 and alb_lookup.stdout | length > 0 and alb_lookup.stdout != "None"
      register: delete_alb
      changed_when: delete_alb.rc == 0
      failed_when: false

    - name: Wait for ALB deletion
      ansible.builtin.command:
        argv:
          - aws
          - elbv2
          - describe-load-balancers
          - --region
          - "{{ aws_region }}"
          - --names
          - "{{ alb_name }}"
          - --query
          - LoadBalancers[0].DNSName
          - --output
          - text
      register: alb_wait
      changed_when: false
      failed_when: false
      until: alb_wait.rc != 0
      retries: 30
      delay: 10

    - name: Look up Kubernetes-managed security groups
      ansible.builtin.command:
        argv:
          - aws
          - ec2
          - describe-security-groups
          - --region
          - "{{ aws_region }}"
          - --filters
          - "Name=vpc-id,Values={{ vpc_id }}"
          - "Name=group-name,Values=k8s-*"
          - --query
          - SecurityGroups[].GroupId
          - --output
          - text
      register: k8s_security_groups
      changed_when: false
      failed_when: false

    - name: Revoke rules that reference Kubernetes-managed security groups
      ansible.builtin.shell: |
        set -euo pipefail
        for referencing in $(aws ec2 describe-security-groups --region "$REGION" \
            --filters "Name=vpc-id,Values=$VPC_ID" "Name=ip-permission.group-id,Values=$SG_ID" \
            --query 'SecurityGroups[].GroupId' --output text); do
          rules=$(aws ec2 describe-security-group-rules --region "$REGION" \
            --filters "Name=group-id,Values=$referencing" \
            --query "SecurityGroupRules[?!IsEgress && ReferencedGroupInfo.GroupId=='$SG_ID'].SecurityGroupRuleId" \
            --output text)
          if [ -n "$rules" ]; then
            # shellcheck disable=SC2086
            aws ec2 revoke-security-group-ingress --region "$REGION" \
              --group-id "$referencing" --security-group-rule-ids $rules >/dev/null
            echo "revoked $rules in $referencing"
          fi
        done
      args:
        executable: /bin/bash
      environment:
        REGION: "{{ aws_region }}"
        VPC_ID: "{{ vpc_id }}"
        SG_ID: "{{ item }}"
      loop: "{{ k8s_security_groups.stdout.split() }}"
      register: revoke_references
      changed_when: "'revoked' in revoke_references.stdout"
      failed_when: false
      when: k8s_security_groups.stdout | length > 0

    - name: Delete Kubernetes-managed security groups
      ansible.builtin.command:
        argv:
          - aws
          - ec2
          - delete-security-group
          - --region
          - "{{ aws_region }}"
          - --group-id
          - "{{ item }}"
      loop: "{{ k8s_security_groups.stdout.split() }}"
      register: delete_security_groups
      changed_when: delete_security_groups.rc == 0
      failed_when: false
      until: delete_security_groups.rc == 0
      retries: 12
      delay: 10
      when: k8s_security_groups.stdout | length > 0

    # monitoring.yml creates these for the ALB, so Terraform can't delete them.
    # Its own node group alarm goes with the destroy and is not selected here.
    - name: Look up the ALB alarms
      ansible.builtin.command:
        argv:
          - aws
          - cloudwatch
          - describe-alarms
          - --region
          - "{{ aws_region }}"
          - --alarm-name-prefix
          - "{{ monitoring_alarm_prefix }}-"
          - --query
          - >-
            MetricAlarms[?AlarmName == '{{ monitoring_alarm_prefix }}-alb-5xx'
            || starts_with(AlarmName, '{{ monitoring_alarm_prefix }}-unhealthy-targets-')].AlarmName
          - --output
          - text
      register: alb_alarms
      changed_when: false

    - name: Delete the ALB alarms
      ansible.builtin.command:
        argv: "{{ ['aws', 'cloudwatch', 'delete-alarms', '--region', aws_region, '--alarm-names'] + alb_alarms.stdout.split() }}"
      changed_when: true
      when: alb_alarms.stdout | length > 0

  handlers:
    - name: Wait for the controller to delete the ALB
      ansible.builtin.command:
        argv:
          - aws
          - elbv2
          - describe-load-balancers
          - --region
          - "{{ aws_region }}"
          - --names
          - "{{ alb_name }}"
      register: alb_controller_wait
      changed_when: false
      failed_when: false
      until: alb_controller_wait.rc != 0
      retries: 18
      delay: 10
