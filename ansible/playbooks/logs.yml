---
- name: Show recent application pod logs
  hosts: local
  gather_facts: false

  vars:
    log_tail_lines: 100

  tasks:
    - name: Configure kubeconfig
      ansible.builtin.import_tasks: ../tasks/kubeconfig.yml

    - name: Get backend logs
      ansible.builtin.command:
        argv:
          - kubectl
          - logs
          - -n
          - "{{ k8s_namespace }}"
          - -l
          - app.kubernetes.io/name={{ backend_deployment }}
          - --tail={{ log_tail_lines }}
      register: backend_logs
      changed_when: false
      failed_when: false

    - name: Get frontend logs
      ansible.builtin.command:
        argv:
          - kubectl
          - logs
          - -n
          - "{{ k8s_namespace }}"
          - -l
          - app.kubernetes.io/name={{ frontend_deployment }}
          - --tail={{ log_tail_lines }}
      register: frontend_logs
      changed_when: false
      failed_when: false

    - name: Print logs
      ansible.builtin.debug:
        msg:
          - "Backend logs:"
          - "{{ backend_logs.stdout_lines }}"
          - "Frontend logs:"
          - "{{ frontend_logs.stdout_lines }}"

