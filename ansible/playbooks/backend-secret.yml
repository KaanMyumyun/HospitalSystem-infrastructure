---
- name: Configure backend Kubernetes secret
  hosts: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

  vars:
    backend_connection_string: "{{ lookup('ansible.builtin.env', 'HOSPITALSYSTEM_CONNECTION_STRING') }}"
    backend_jwt_secret: "{{ lookup('ansible.builtin.env', 'HOSPITALSYSTEM_JWT_SECRET') }}"

  tasks:
    - name: Require backend secret environment variables
      ansible.builtin.fail:
        msg: >-
          Set HOSPITALSYSTEM_CONNECTION_STRING and HOSPITALSYSTEM_JWT_SECRET
          before running this playbook.
      when: backend_connection_string | length == 0 or backend_jwt_secret | length == 0

    - name: Configure kubeconfig
      ansible.builtin.import_tasks: ../tasks/kubeconfig.yml

    - name: Ensure namespace exists
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl create namespace "{{ k8s_namespace }}" --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      changed_when: false

    - name: Apply backend secret from environment
      ansible.builtin.shell: |
        set -euo pipefail
        printf '%s\n' \
          "ConnectionStrings__DefaultConnection=$HOSPITALSYSTEM_CONNECTION_STRING" \
          "JwtSettings__SecretKey=$HOSPITALSYSTEM_JWT_SECRET" \
          | kubectl create secret generic hospital-backend-secrets \
            -n "{{ k8s_namespace }}" \
            --from-env-file=/dev/stdin \
            --dry-run=client -o yaml \
          | kubectl apply -f -
      args:
        executable: /bin/bash
      register: backend_secret_apply
      changed_when: "'created' in backend_secret_apply.stdout or 'configured' in backend_secret_apply.stdout"
      no_log: true
