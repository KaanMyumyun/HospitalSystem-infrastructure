---
# The backend's connection string and JWT key live in AWS Secrets Manager
# (terraform/secrets.tf), and External Secrets copies them into the
# hospital-backend-secrets Secret. This playbook:
#
# 1. stores HOSPITALSYSTEM_CONNECTION_STRING and HOSPITALSYSTEM_JWT_SECRET in
#    Secrets Manager when both are set and differ from the stored value. With
#    neither set, it keeps the stored value, so a value rotated in Secrets
#    Manager isn't overwritten by an old local one.
# 2. applies the ExternalSecret and waits for the Secret to hold that value.
# 3. restarts the backend when the Secret differs from the one its pods
#    started with. envFrom only reads a Secret when a container starts. A
#    Deployment scaled to 0 stays at 0; the next scale-up reads the new Secret.
- name: Configure backend runtime secret
  hosts: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

  vars:
    backend_connection_string: "{{ lookup('ansible.builtin.env', 'HOSPITALSYSTEM_CONNECTION_STRING') }}"
    backend_jwt_secret: "{{ lookup('ansible.builtin.env', 'HOSPITALSYSTEM_JWT_SECRET') }}"
    backend_secret_values:
      ConnectionStrings__DefaultConnection: "{{ backend_connection_string }}"
      JwtSettings__SecretKey: "{{ backend_jwt_secret }}"
    backend_secret_k8s_name: hospital-backend-secrets
    external_secret_manifest: "{{ playbook_dir }}/../../.generated/kubernetes/backend/external-secret.yaml"
    # External Secrets writes a hash of the Secret's data to this annotation;
    # the Deployment keeps the hash its pods started with in the other one.
    secret_data_hash_jsonpath: "{.metadata.annotations.reconcile\\.external-secrets\\.io/data-hash}"
    started_with_annotation: hospitalsystem.io/backend-secrets-hash

  tasks:
    - name: Require both backend secret variables, or neither
      ansible.builtin.fail:
        msg: >-
          Set both HOSPITALSYSTEM_CONNECTION_STRING and HOSPITALSYSTEM_JWT_SECRET
          to store new values, or neither to keep the ones in Secrets Manager.
      when: (backend_connection_string | length == 0) != (backend_jwt_secret | length == 0)

    - name: Check that Terraform created the Secrets Manager secret
      ansible.builtin.command:
        argv:
          - aws
          - secretsmanager
          - describe-secret
          - --region
          - "{{ aws_region }}"
          - --secret-id
          - "{{ backend_secret_name }}"
          - --query
          - Name
          - --output
          - text
      changed_when: false

    - name: Read the stored backend secret
      ansible.builtin.command:
        argv:
          - aws
          - secretsmanager
          - get-secret-value
          - --region
          - "{{ aws_region }}"
          - --secret-id
          - "{{ backend_secret_name }}"
          - --query
          - SecretString
          - --output
          - text
      register: stored_secret
      changed_when: false
      failed_when: false
      no_log: true

    # A secret with no value yet also answers ResourceNotFoundException.
    - name: Stop on errors other than a missing value
      ansible.builtin.fail:
        msg: "Could not read {{ backend_secret_name }}: {{ stored_secret.stderr }}"
      when: stored_secret.rc != 0 and 'ResourceNotFoundException' not in stored_secret.stderr

    - name: Require a value when none is stored
      ansible.builtin.fail:
        msg: >-
          {{ backend_secret_name }} has no value yet. Set
          HOSPITALSYSTEM_CONNECTION_STRING and HOSPITALSYSTEM_JWT_SECRET and run again.
      when: stored_secret.rc != 0 and backend_connection_string | length == 0

    - name: Compare the local values with the stored ones
      ansible.builtin.set_fact:
        backend_secret_update: >-
          {{ backend_connection_string | length > 0
             and (stored_secret.rc != 0 or stored_secret.stdout | from_json != backend_secret_values) }}
      no_log: true

    - name: Store the backend secret in Secrets Manager
      ansible.builtin.command:
        argv:
          - aws
          - secretsmanager
          - put-secret-value
          - --region
          - "{{ aws_region }}"
          - --secret-id
          - "{{ backend_secret_name }}"
          - --secret-string
          - file:///dev/stdin
        stdin: "{{ backend_secret_values | to_json }}"
        stdin_add_newline: false
      changed_when: true
      when: backend_secret_update | bool
      no_log: true

    - name: Configure kubeconfig
      ansible.builtin.import_tasks: ../tasks/kubeconfig.yml

    - name: Ensure namespace exists
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl create namespace "{{ k8s_namespace }}" --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      changed_when: false

    - name: Ensure the generated manifest directory exists
      ansible.builtin.file:
        path: "{{ external_secret_manifest | dirname }}"
        state: directory
        mode: "0755"

    - name: Render the ExternalSecret manifests
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../kubernetes/backend/external-secret.yaml.j2"
        dest: "{{ external_secret_manifest }}"
        mode: "0644"

    - name: Read the Secret's data hash before syncing
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - secret
          - "{{ backend_secret_k8s_name }}"
          - -n
          - "{{ k8s_namespace }}"
          - --ignore-not-found
          - -o
          - "jsonpath={{ secret_data_hash_jsonpath }}"
      register: secret_hash_before
      changed_when: false

    - name: Apply the ExternalSecret
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - "{{ external_secret_manifest }}"
      register: external_secret_apply
      changed_when: "'created' in external_secret_apply.stdout or 'configured' in external_secret_apply.stdout"

    # Without this, External Secrets only picks up the new value at its next
    # hourly refresh.
    - name: Ask External Secrets to sync now
      ansible.builtin.command:
        argv:
          - kubectl
          - annotate
          - externalsecret
          - "{{ backend_secret_k8s_name }}"
          - -n
          - "{{ k8s_namespace }}"
          - --overwrite
          - "force-sync={{ now(utc=true, fmt='%s') }}"
      changed_when: true
      when: backend_secret_update | bool

    - name: Wait for the ExternalSecret to be ready
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - externalsecret
          - "{{ backend_secret_k8s_name }}"
          - -n
          - "{{ k8s_namespace }}"
          - -o
          - jsonpath={.status.conditions[?(@.type=="Ready")].status} {.status.conditions[?(@.type=="Ready")].message}
      register: external_secret_status
      changed_when: false
      until: external_secret_status.stdout.startswith('True')
      # A role Terraform has just created can take a moment to be assumable.
      retries: 36
      delay: 5

    # A new value has synced once the hash changes. Before the first sync it
    # is empty: an older Secret created by kubectl has no hash annotation.
    - name: Wait for the Secret to hold the stored value
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - secret
          - "{{ backend_secret_k8s_name }}"
          - -n
          - "{{ k8s_namespace }}"
          - -o
          - "jsonpath={{ secret_data_hash_jsonpath }}"
      register: secret_hash
      changed_when: false
      until: >-
        secret_hash.stdout | length > 0
        and not (backend_secret_update | bool and secret_hash.stdout == secret_hash_before.stdout)
      retries: 24
      delay: 5

    - name: Read the backend Deployment
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - deployment
          - "{{ backend_deployment }}"
          - -n
          - "{{ k8s_namespace }}"
          - --ignore-not-found
          - -o
          - json
      register: backend_deployment_read
      changed_when: false

    # On a new cluster the Deployment doesn't exist yet; apply-kubernetes.yml
    # creates it after this and its pods read the synced Secret. A Deployment
    # that has never recorded a hash started from the Secret as it is now,
    # unless this run just changed it.
    - name: Decide whether the backend must restart
      ansible.builtin.set_fact:
        backend_started_with: "{{ (backend_deployment_read.stdout | from_json).metadata.annotations[started_with_annotation] | default('') }}"
      when: backend_deployment_read.stdout | length > 0

    - name: Restart the backend so its pods read the new Secret
      ansible.builtin.command:
        argv:
          - kubectl
          - patch
          - deployment
          - "{{ backend_deployment }}"
          - -n
          - "{{ k8s_namespace }}"
          - -p
          - >-
            {{ {'metadata': {'annotations': {started_with_annotation: secret_hash.stdout}},
                'spec': {'template': {'metadata': {'annotations': {'kubectl.kubernetes.io/restartedAt': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')}}}}}
               | to_json }}
      register: backend_restart
      changed_when: true
      when:
        - backend_started_with is defined
        - backend_secret_update | bool or (backend_started_with | length > 0 and backend_started_with != secret_hash.stdout)

    - name: Record the Secret the running pods started with
      ansible.builtin.command:
        argv:
          - kubectl
          - annotate
          - deployment
          - "{{ backend_deployment }}"
          - -n
          - "{{ k8s_namespace }}"
          - --overwrite
          - "{{ started_with_annotation }}={{ secret_hash.stdout }}"
      changed_when: true
      when:
        - backend_started_with is defined
        - backend_restart is skipped
        - backend_started_with != secret_hash.stdout

    - name: Wait for the backend restart
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - status
          - deployment/{{ backend_deployment }}
          - -n
          - "{{ k8s_namespace }}"
          - --timeout=300s
      changed_when: false
      when: backend_restart is not skipped
