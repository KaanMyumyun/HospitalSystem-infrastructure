apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-backend
  namespace: hospitalsystem
  labels:
    app.kubernetes.io/name: hospital-backend
    app.kubernetes.io/part-of: hospitalsystem
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hospital-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hospital-backend
        app.kubernetes.io/part-of: hospitalsystem
    spec:
      containers:
        - name: backend
          image: 147914447694.dkr.ecr.eu-north-1.amazonaws.com/hospital-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hospital-backend-config
            - secretRef:
                name: hospital-backend-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
